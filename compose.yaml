services:
  postgres:
    image: postgres:16
    profiles:
      - postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 5s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODE: ""
      DATABASE_TYPE: sqlite
      SQLITE_DB_PATH: /app/state/checkpoints.db
    volumes:
      - ./privatecredentials:/privatecredentials
      - ./data:/app/data:ro
      - ./qdrant_data:/app/qdrant_data
      - checkpoint_data:/app/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8080/health", timeout=5)
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - path: src/agents/
          action: sync+restart
          target: /app/src/agents/
        - path: src/business/
          action: sync+restart
          target: /app/src/business/
        - path: src/core/
          action: sync+restart
          target: /app/src/core/
        - path: src/mcp_servers/
          action: sync+restart
          target: /app/src/mcp_servers/
        - path: src/memory/
          action: sync+restart
          target: /app/src/memory/
        - path: src/schema/
          action: sync+restart
          target: /app/src/schema/
        - path: src/service/
          action: sync+restart
          target: /app/src/service/

  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8501:8501"
    depends_on:
      agent_service:
        condition: service_healthy
    environment:
      AGENT_URL: http://agent_service:8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8501/healthz", timeout=5)
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - path: src/client/
          action: sync+restart
          target: /app/client/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/streamlit_app.py
          action: sync+restart
          target: /app/streamlit_app.py

volumes:
  postgres_data:
  checkpoint_data: